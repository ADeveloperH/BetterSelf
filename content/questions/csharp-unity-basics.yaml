- id: q-string-builder
  title: string 的不可变性意味着什么？何时考虑 StringBuilder？
  topic: C# 与内存
  tags:
    - C#
    - 字符串
  level: 基础
  shortAnswer: string 的内容创建后不能原地修改。需要反复拼接大量片段时，可以考虑 StringBuilder；少量拼接应结合编译器和实际开销判断。
  explanation: |
    ### 案例：战斗倒计时每帧拼接 UI 文本

    一个 60 FPS 更新的倒计时只显示整数秒。如果每帧执行“剩余：”加数字，显示结果大部分时间不变，却仍反复构造文本、给控件赋值。我会先确认显示精度和时间来源，优先减少无效刷新，再考虑拼接工具。

    ~~~csharp
    int shownSeconds = -1;
    void Refresh(float remaining) {
        int seconds = UnityEngine.Mathf.Max(0,
            UnityEngine.Mathf.CeilToInt(remaining));
        if (seconds == shownSeconds) return;
        shownSeconds = seconds;
        // 在此格式化，再更新实际使用的文本控件
    }
    ~~~

    这段代码展示刷新门控，不是完整计时器。后台恢复后应从正确的时间源重算剩余时间，不能靠减少 UI 刷新次数累计计时。重新绑定任务、语言或格式变化时也要使缓存失效，否则秒数相同仍会漏刷新。隐藏面板可暂停刷新，重开时强制同步。

    ### StringBuilder 放在确实需要大量追加的地方

    string 创建后内容不可原地修改，但这不意味着任何少量拼接都必须用 StringBuilder。比如结算窗口需要循环生成许多战斗条目的汇总文本时，构建器更值得评估：

    ~~~csharp
    using System.Text;
    // 方法内：labels 为待展示条目
    var builder = new StringBuilder();
    for (int i = 0; i < labels.Count; i++) {
        builder.Append(labels[i]);
    }
    string text = builder.ToString();
    ~~~

    StringBuilder 的创建、扩容和最终 ToString 都有成本；重用时还要管理 Clear、容量和持有大缓冲区的代价。先构造字符串再比较是否相同，已经支付了此前的构造成本。

    ### 对照测试与功能回归

    我会把少量固定拼接、大量循环追加和 UI 刷新分成三类工作负载，固定输入与输出，在目标设备、相同脚本后端和构建配置下预热后多轮交错采样。完整计入构建器生命周期、扩容、最终字符串以及控件更新，不在计时区间打日志。

    同时观察分配、耗时和长期占用；回到完整界面确认是否改善长帧。保留原始样本、采样规模及 P95 / P99 等分布，不能用单次 Editor 均值声称所有手机收益一致。

    功能上覆盖边界秒数、到零、暂停恢复、隐藏重开、换任务和语言切换。最终回答应落到：“倒计时先按可见变化刷新，大量汇总文本再评估 StringBuilder，用完整路径数据和显示正确性决定方案。”
  pitfalls:
    - 认为任何字符串拼接都应该换成 StringBuilder。
    - 认为用了 StringBuilder 就完全没有分配。
    - 先 ToString 或拼接，再比较新旧字符串，忽略此前已发生的构造。
    - 仅按数值缓存，语言或绑定对象变化时不刷新。
    - 只计 Append，不计创建和 ToString。
    - 用单次 Editor 计时宣布所有手机都提升同样比例。
