- id: q-boxing
  title: 什么是装箱与拆箱？如何识别代码中的装箱？
  topic: C# 与内存
  tags:
    - C#
    - 装箱
    - 内存管理
  level: 原理
  shortAnswer: 装箱把值类型转换为 object 或其实现的接口类型，通常需要创建承载该值的对象；拆箱从这个对象中提取对应的值类型。
  explanation: |
    ### 案例：每帧统计战斗分数产生临时分配

    假设战斗统计每帧把分数放入通用集合或传入 object 参数的接口。我的第一步是找值类型转换为 object 或接口的位置，而不是把所有 GC.Alloc 都叫装箱。

    ~~~csharp
    var values = new System.Collections.Generic.List<int>(100);
    var objects = new System.Collections.Generic.List<object>(100);
    int score = 42;
    values.Add(score); // 槽位保存 int，此处无需装箱
    objects.Add(score); // int 转 object，发生装箱
    int restored = (int)objects[0]; // 按原装箱类型拆箱
    long widened = (int)objects[0]; // 先拆为 int，再做数值转换
    // (long)objects[0] 不能直接拆出原来装箱的 int
    ~~~

    ### 处理：修改实际热路径的类型边界

    同类数值优先使用 List<int> 等明确类型，避免在高频接口中无必要地转为 object。预设 List<object> 容量只能减少扩容，不能取消 Add(score) 的装箱；反过来 List<int> 也有集合、容量等成本，通过非泛型接口枚举等调用方式仍可能分配。

    如果日志接口带 object 参数，需要区分参数装箱、字符串格式化和最终日志输出。确认关闭日志时调用方是否仍构造参数，再调整接口或调用条件。不是所有类型转换都会装箱，具体后端是否消除某次分配以目标 Player 的证据为准。

    ### 验证：证明是哪一个调用在分配

    1. 写下假设：哪个 int → object 转换、每帧调用多少次，以及改动后业务输出应保持什么。
    2. 在目标设备运行可采样的测试 Player，打开 Unity 2022.3 的 Window > Analysis > Profiler，连接目标；在 CPU Usage 中定位复现帧的 GC.Alloc 样本，按该版本工具启用分配 Call Stacks。
    3. 预热并固定集合容量，把加入、读取、遍历分开观察；隔离初始化、日志输出、扩容和格式化的干扰，只替换一个怀疑调用做对照。
    4. 确认目标调用的分配栈消失或变化、输出一致，再在正常发布配置复核帧时间。记录设备、Unity 版本、脚本后端、调用次数、分配与采样方式。

    Deep Profile 会扰动耗时，先用普通采样和分配调用栈缩小范围，必要时再局部使用。不凭 Editor 的一个总数宣布真机收益，也不编造每次分配大小或优化百分比。

    ### 面试表达

    “我从分数进入 object 接口的位置提出装箱假设，用真机调用栈区分装箱与扩容等成本，再把同类型热路径改为泛型或明确类型，最后验证分配来源和业务输出。”如果没有采样数据，应说明这是排查方案，而不是已验证的优化结果。
  pitfalls:
    - 认为所有类型转换都会装箱。
    - 认为把装箱的 int 直接拆成 long 就等同于数值转换。
    - 认为预分配 List<object> 容量就能消除 int 装箱。
    - 把所有集合分配都归因于装箱。
    - 把 Profiler 自身或 Editor 界面分配算成业务调用。
    - 只看总分配减少就断言某个转换被消除。
