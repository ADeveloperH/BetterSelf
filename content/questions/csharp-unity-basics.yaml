- id: q-value-reference
  title: 值类型和引用类型的主要区别是什么？
  topic: C# 与内存
  tags:
    - C#
    - 类型系统
  level: 基础
  shortAnswer: 普通赋值时，值类型复制值，引用类型复制对象引用。两个引用变量可能指向同一个对象；包含引用字段的结构体也可能共享内部对象。
  explanation: |
    可以从一段最小代码说明“复制引用”和“复制对象”的区别：

    ```csharp
    var original = new List<int> { 1 };
    var alias = original;
    alias.Add(2);
    // original 和 alias 指向同一个 List，元素数都为 2。
    ```

    继续追问时，分别分析值类型字段、引用类型字段，以及是否用了 `ref` 参数。回答应建立在具体代码的语义上。
  pitfalls:
    - 把值类型简单描述为“永远在栈上”。
    - 把结构体赋值误认为会深拷贝所有内部对象。
  followUps:
    - q-struct-list-copy
    - q-reference-ref
  articleIds:
    - csharp-memory-basics
  applicability: C# 普通赋值与参数语义；具体运行时的存储优化另行测量。
  updatedAt: 2026-10-27
  verifiedAt: 2026-10-22
  sample: true
  sources:
    - title: Microsoft · C# 类型规范
      url: https://learn.microsoft.com/en-us/dotnet/csharp/language-reference/language-specification/types
- id: q-boxing
  title: 什么是装箱与拆箱？如何识别代码中的装箱？
  topic: C# 与内存
  tags:
    - C#
    - 装箱
    - 内存管理
  level: 原理
  shortAnswer: 装箱把值类型转换为 object 或其实现的接口类型，通常需要创建承载该值的对象；拆箱从这个对象中提取对应的值类型。
  explanation: |
    ```csharp
    int score = 42;
    object boxed = score;
    int restored = (int)boxed;
    ```

    定位时先检查值传给了什么类型的参数，再看调用点和泛型约束。对实际热路径，结合编译结果和目标运行时的分配数据验证。拆箱还要求原来的装箱类型匹配。
  pitfalls:
    - 认为所有类型转换都会装箱。
    - 认为把装箱的 int 直接拆成 long 就等同于数值转换。
  followUps:
    - q-generic-boxing
    - q-allocation-proof
  articleIds:
    - csharp-memory-basics
  applicability: C# 装箱语义；Unity 后端的优化效果以实际测量为准。
  updatedAt: 2026-10-27
  verifiedAt: 2026-10-22
  sample: true
  sources:
    - title: Microsoft · 装箱与拆箱
      url: https://learn.microsoft.com/en-us/dotnet/csharp/programming-guide/types/boxing-and-unboxing
- id: q-string-builder
  title: string 的不可变性意味着什么？何时考虑 StringBuilder？
  topic: C# 与内存
  tags:
    - C#
    - 字符串
  level: 基础
  shortAnswer: string 的内容创建后不能原地修改。需要反复拼接大量片段时，可以考虑 StringBuilder；少量拼接应结合编译器和实际开销判断。
  explanation: |
    ```csharp
    var builder = new StringBuilder();
    for (int index = 0; index < labels.Count; index++)
    {
        builder.Append(labels[index]);
    }
    string text = builder.ToString();
    ```

    要比较的是完整路径，包括构建器、容量扩展和最终字符串的成本。StringBuilder 也需要内存，适合放在实际场景中测量。
  pitfalls:
    - 认为任何字符串拼接都应该换成 StringBuilder。
    - 认为用了 StringBuilder 就完全没有分配。
  followUps:
    - q-ui-text-refresh
    - q-string-benchmark
  articleIds:
    - csharp-memory-basics
  applicability: .NET 字符串基础；性能取决于实际使用方式。
  updatedAt: 2026-10-27
  verifiedAt: 2026-10-22
