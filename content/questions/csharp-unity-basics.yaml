- id: q-value-reference
  title: 值类型和引用类型的主要区别是什么？
  topic: C# 与内存
  tags:
    - C#
    - 类型系统
  level: 基础
  shortAnswer: 普通赋值时，值类型复制值，引用类型复制对象引用。两个引用变量可能指向同一个对象；包含引用字段的结构体也可能共享内部对象。
  explanation: |
    ### 案例：背包预览修改了真实背包

    在装备预览界面，需要复制背包状态，让玩家试换装备后再确认。如果用 struct 包住 List，再直接赋值给预览数据，修改预览列表可能连真实背包一起变。

    我会先区分“变量复制”和“对象复制”：struct 赋值复制每个字段，其中 List 字段复制的是引用；两份结构体仍然指向同一个列表。这里的关键是共享了什么，与“struct 一定在栈上”无关。

    ~~~csharp
    using System.Collections.Generic;
    struct Bag { public List<int> Items; }

    // 方法内：模拟背包预览
    var original = new Bag { Items = new List<int> { 1 } };
    var preview = original;
    preview.Items.Add(2); // original.Items.Count 也变为 2
    preview.Items = new List<int> { 9 }; // 只替换 preview 的字段
    // original.Items 仍是包含 1、2 的原列表
    ~~~

    ### 处理：明确快照的隔离边界

    如果列表元素只有物品 ID 等值数据，可以先复制容器：preview.Items = new List<int>(original.Items)。如果是 List<Item>，新容器中的 Item 引用仍可能共享，改 Item.Count 还会影响原物品。

    我会只复制预览要修改的状态，或使用 ID 加值数据的快照；确认时提交变更，取消时丢弃快照。递归深拷贝整个对象图会增加分配和维护成本，不能只为了“独立”就全部复制。不可变快照也必须限制内部可变引用，不能仅给字段加 readonly。

    ### 同一案例中的参数传递：修改列表与替换列表

    普通引用类型参数按值传递，复制的是引用。函数能修改共享对象，但给参数重新赋值不会替换调用方变量。ref 允许修改调用方变量本身。

    ~~~csharp
    static void Change(List<int> items) {
        items.Add(2); // 调用方看得到
        items = new List<int> { 9 }; // 只改局部参数
    }
    static void Replace(ref List<int> items) {
        items = new List<int> { 9 }; // 替换调用方变量
    }
    ~~~

    如果只需要生成预览列表，我更倾向显式返回新集合，便于表达所有权；确需替换调用方变量才用 ref。值类型使用 ref 也能修改调用方的值，但它不是无条件的性能优化开关。替换变量后，其他别名仍可能指向旧对象。

    ### 验证与面试表达

    分别验证 Add、替换列表字段、修改嵌套 Item、确认及取消预览；普通传参和 ref 传参检查元素与引用身份，明确 null 输入契约。

    可以这样收束回答：“我先确认复制的层级，定位到结构体内部的共享引用，再按预览需要建立独立状态，并用嵌套对象修改和取消预览验证隔离。”这是案例分析方式，不代表已完成的个人项目成果。
  pitfalls:
    - 把值类型简单描述为“永远在栈上”。
    - 把结构体赋值误认为会深拷贝所有内部对象。
    - 把容器复制等同于递归深拷贝。
    - 把引用类型按值传参称为 ref 传参。
    - 以为替换一个变量会让其他旧别名自动改指向。
