- id: q-gc-alloc
  title: Unity 每帧都有 GC Alloc，你会如何排查？
  topic: 移动端性能诊断
  tags:
    - Unity
    - GC
    - 性能分析
  level: 场景
  shortAnswer: 先固定复现场景并在目标 Player 采样，找到反复分配的调用点，再修改一个明确原因，对比修改前后的分配与帧耗时。
  explanation: |
    按“复现 → 采样 → 调用栈 → 修改 → 对比”的顺序记录证据。重点检查临时集合、字符串和可能装箱的热路径。性能数据注明设备、Unity 版本、脚本后端和构建配置。

    仅看到分配并不能判断它是否造成了可感知的卡顿，还要结合频率、规模和帧时间分析。
  pitfalls:
    - 将 Editor 中的数值直接等同于设备上的结果。
    - 为减少分配而引入过多缓存，却不检查内存占用与行为。
  followUps:
    - q-allocation-frame-time
    - q-performance-regression
  articleIds:
    - csharp-memory-basics
  applicability: 排查方法参考 Unity 2022.3；具体工具界面与数据按项目版本核验。
  updatedAt: 2026-10-27
  verifiedAt: 2026-10-22
  sample: true
  sources:
    - title: Unity 2022.3 · 垃圾回收最佳实践
      url: https://docs.unity3d.com/2022.3/Documentation/Manual/performance-garbage-collection-best-practices.html
- id: q-coroutines
  title: Unity 协程与多线程有什么区别？
  topic: Unity 异步与生命周期
  tags:
    - Unity
    - 协程
  level: 原理
  shortAnswer: Unity 协程通过挂起和恢复，把工作分布到不同帧或时机。协程中的同步代码仍在主线程执行；耗时计算并不会因为放入协程就自动转移到后台。
  explanation: |
    ```csharp
    IEnumerator ShowSteps()
    {
        ShowFirstStep();
        yield return null;
        ShowSecondStep();
    }
    ```

    这段代码表达的是执行时机。选择多线程方案时，还需要考虑共享数据和 Unity API 的线程限制。
  pitfalls:
    - 认为 yield return null 会让前面的计算在后台运行。
    - 认为把大循环放进协程就自动消除了单帧卡顿。
  followUps:
    - q-coroutine-frame-budget
    - q-jobs-boundary
  articleIds:
    - csharp-memory-basics
  applicability: Unity 协程的主线程语义；参考 Unity 6.3 文档。
