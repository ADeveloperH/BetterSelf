- id: q-coroutines
  title: Unity 协程与多线程有什么区别？
  topic: Unity 异步与生命周期
  tags:
    - Unity
    - 协程
  level: 原理
  shortAnswer: Unity 协程通过挂起和恢复，把工作分布到不同帧或时机。协程中的同步代码仍在主线程执行；耗时计算并不会因为放入协程就自动转移到后台。
  explanation: |
    ### 案例：打开背包时一次创建大量列表项

    把创建列表的大循环放进 IEnumerator，仍可能卡住一帧。协程控制挂起和恢复的时机，yield 之前的同步代码仍在主线程；循环结束后才 yield，不能拆掉已经发生的长帧。

    ### 方案一：在安全边界分帧，并管理取消与清理

    ~~~csharp
    System.Collections.IEnumerator BuildRows(int count) {
        const int perFrame = 8; // 示例值，必须按设备测量
        for (int i = 0; i < count; i++) {
            CreateRow(i); // 项目自己的主线程 UI 创建方法
            if ((i + 1) % perFrame == 0) yield return null;
        }
    }
    ~~~

    这段代码只展示分割点，接入时还要补任务所有者、取消入口与部分结果清理。固定八个只是示例：每项成本不同就不能保证耗时，可在可拆分的安全边界用时间预算决定何时挂起。如果一次 CreateRow 已超过预算，必须进一步拆分、减少实例化或预热。

    用户关闭、重开窗口时，停止旧任务并清理已创建项；使用请求版本检查后续结果，防止旧任务覆盖新窗口。失败、场景卸载和对象复用也遵循同一所有权契约。

    分帧是在单帧预算与总完成时延之间取舍，不等于并行加速。我会测每帧最长工作段、总完成时间以及交互是否被阻塞，再回归关闭重开、取消和切场景。

    ### 方案二：纯数据计算再评估 Job 或后台任务

    如果耗时的是批量角色路径评分，我会先拆成“主线程读取场景并构造数值输入 → 纯数据计算 → 主线程应用结果”。GameObject、Transform 等场景操作不能随意搬到工作线程。

    Unity Job System 适合可划分、依赖明确且计算量足够的数据工作，通常结合 NativeContainer 管理内存和依赖；后台 Task 用于目标平台支持的线程安全托管计算或适当的 I/O 协作。async 或 await 本身不保证后台执行，不能把它当作线程切换声明。

    结果回传时角色可能已销毁或被对象池重新租用。结果应带请求或租用版本，回到主线程后检查对象身份与所有权；取消请求不保证所有排队回调都消失，还要丢弃过期结果并释放资源。

    ### 验证与面试表达

    比较串行计算与调度、复制、等待、结果应用的完整成本；小任务可能抵不过调度开销。覆盖数据竞争、异常、资源释放、退出场景与目标平台限制，避免调度后立即等待而把主线程重新堵住。

    最终可回答：“UI 创建先考虑主线程分帧与生命周期；可独立的纯数据重计算才考虑并行，按完整耗时和取消、销毁后的正确性选择方案。”这些是项目场景示例，不是已有性能收益声明。
  pitfalls:
    - 认为 yield return null 会让前面的计算在后台运行。
    - 认为把大循环放进协程就自动消除了单帧卡顿。
    - 大循环执行完后才 yield，认为已经分帧。
    - 把每帧八个当作通用性能参数。
    - 认为 await 后必定到了后台线程。
    - 忽略回传时对象已被复用或销毁。
