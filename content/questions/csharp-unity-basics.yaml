- id: q-gc-alloc
  title: Unity 每帧都有 GC Alloc，你会如何排查？
  topic: 移动端性能诊断
  tags:
    - Unity
    - GC
    - 性能分析
  level: 场景
  shortAnswer: 先固定复现场景并在目标 Player 采样，找到反复分配的调用点，再修改一个明确原因，对比修改前后的分配与帧耗时。
  explanation: |
    ### 案例：战斗连续释放技能时周期性卡顿

    假设复现操作是连续释放技能，期间反复创建特效、临时集合和文本。先记录设备、Unity 版本、脚本后端、构建方式和操作序列，区分持续低帧、周期长帧、首个特效抖动与切关停顿，不把“有 GC.Alloc”直接等同于根因。

    ### 排查：先建立分配与长帧的证据链

    1. 在目标设备复现，通过 Window > Analysis > Profiler 连接测试 Player；在 CPU Usage 选择问题帧，检查 GC.Alloc 及对应调用栈，区分初始化与稳定战斗阶段。
    2. 对齐长帧和回收、实例化、脚本计算等样本。先检查反复创建的集合、字符串和装箱热路径；总分配下降不代表某次分配已经被定位。
    3. 假如证据指向频繁创建特效，再对该路径做对象池对照；如果证据指向文本或临时集合，则分别处理。每次保留相同输入，只验证一个明确假设。

    ### 方案：对象池同时改变了生命周期

    池化可能减少创建与分配，但会保留状态、回调与内存。我会先定义租用和归还契约，明确谁重置 Transform、粒子、动画、碰撞、业务字段和事件订阅；必要时限制容量，控制预热时机。

    特别要处理“对象已回收并重新租用，旧请求才返回”的情况：给请求与租用带身份或版本，在应用结果前确认仍属于当前租用；不能只凭对象还存在就执行旧回调。取消、重复完成和双重回收也需要可断言的行为。

    ### 分配变少后，继续检查帧时间与成本转移

    如果 GC.Alloc 降下来了，玩家仍觉得卡，我会继续分流 CPU、渲染线程和 GPU，检查资源加载、Shader 首次使用、同步等待及池预热。主线程在等待不代表主线程脚本最慢，托管零分配也不代表没有原生内存或其他开销。

    对比同一关卡同一操作的长帧分布、内存峰值、启动及切关耗时，确认没有把成本从战斗移到入场，也没有用持续增长的缓存换取表面改善。

    ### 验证与回退

    - 连续生成、归还、复用，检查视觉与业务状态是否符合新对象契约。
    - 模拟迟到回调、失败重试、双重回收、超出池容量、切场景及暂停恢复，检查错误复用与泄漏。
    - 相同设备和构建条件下保留修改前后采样与录像，同时检查帧时间、总完成时间和峰值内存；采样构建用于定位，正常发布配置复核体验。
    - 保留基线和变更开关，内部验证后逐步观察。只报告已执行的覆盖范围，未测设备与长时稳定性列为待验证。

    面试中我会按“复现与证据 → 根因假设 → 有边界的改动 → 性能和功能双验证 → 回退”讲述。没有真实采样时，不预设唯一根因，也不声称卡顿已经解决。
  pitfalls:
    - 将 Editor 中的数值直接等同于设备上的结果。
    - 为减少分配而引入过多缓存，却不检查内存占用与行为。
    - 把 GC.Alloc = 0 当作整帧没有内存或性能开销。
    - 只看平均 FPS，忽略长帧和内存峰值。
    - 以单元测试通过替代所有真机视觉和长时测试。
    - 对象池只检查位置复位，不模拟迟到回调。
