- id: q-coroutine-frame-budget
  parentId: q-coroutines
  title: 如何把一次大循环拆成多帧完成？
  topic: Unity 异步与生命周期
  tags: &a7
    - Unity
    - 协程
  level: 场景
  shortAnswer: 给每帧工作设置数量或时间预算，在循环内部定期 yield return null，并保存进度。协程仍在主线程执行；单个不可拆任务若已超预算，最后加 yield 也无法消除那一帧卡顿。
  explanation: |-
    ### 场景：打开界面时要创建一批列表项
    ```csharp
    System.Collections.IEnumerator BuildRows(int count) {
        const int perFrame = 8; // 教学示意，需要按设备测量
        for (int i = 0; i < count; i++) {
            CreateRow(i); // 项目自己的主线程方法
            if ((i + 1) % perFrame == 0) yield return null;
        }
    }
    ```

    ### 增加约束：每个任务成本不一样
    固定数量不能保证固定耗时；可在安全边界测量已用时间，达到预算后挂起。但一次 CreateRow 若耗时很长，需要进一步拆分、减少实例化成本或预热，而不是只缩小循环批次数。

    ### 增加约束：用户中途关闭窗口
    明确任务所有者、取消 / 停止入口与部分结果清理；重新打开时旧任务不能重复创建或覆盖新窗口。用版本号或取消状态检查后续应用结果，处理失败时也清理已创建项。

    ### 怎么验证
    记录每帧最长工作段与总完成时间，回归取消、重入、场景卸载和用户交互。分帧通常牺牲总完成时延换取单帧预算，不等同于并行加速。

    **回答要点：** 分割点 → 每帧预算 → 取消与清理 → 总时延取舍。
  pitfalls:
    - 大循环执行完后才 yield，认为已经分帧。
    - 把每帧八个当作通用性能参数。
