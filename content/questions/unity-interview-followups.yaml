- id: q-generic-boxing
  parentId: q-boxing
  title: List<int> 与 List<object> 保存整数时有什么区别？
  topic: C# 与内存
  tags: &a2
    - C#
    - 装箱
    - 内存管理
  level: 场景
  shortAnswer: List<int> 的元素槽保存 int 值；List<object> 接收 int 时需要装箱，元素槽保存装箱对象的引用。两者都有集合和容量成本；泛型集合并不代表所有操作都没有分配。
  explanation: |-
    ### 场景：每帧收集一批分数
    ```csharp
    var values = new System.Collections.Generic.List<int>(100);
    var objects = new System.Collections.Generic.List<object>(100);
    values.Add(42);    // 此处不需要为 int 装箱
    objects.Add(42);   // int 转为 object，发生装箱
    int restored = (int)objects[0];
    ```

    ### 继续深入
    预设容量可以减少扩容，但不能取消 objects.Add 的类型转换；List<int> 转成非泛型接口再枚举等其他调用方式也可能产生额外开销。解释具体调用点，而不是说“泛型全程零 GC”。

    ### 如何选型与验证
    同类数值优先用明确元素类型，确需异构数据时再评估 object。先预热并固定容量，分别测加入、读取和遍历；去掉日志，核对目标 Player 的分配调用栈，区分装箱、扩容、枚举和字符串格式化。

    **回答要点：** 元素表示 → 转换位置 → 容量与其他开销 → 测量边界。
  pitfalls:
    - 认为预分配 List<object> 容量就能消除 int 装箱。
    - 把所有集合分配都归因于装箱。
  followUps: []
