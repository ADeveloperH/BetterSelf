- id: q-reference-ref
  parentId: q-value-reference
  title: 普通引用类型参数与 ref 参数有什么区别？
  topic: C# 与内存
  tags: *a1
  level: 场景
  shortAnswer: 普通引用类型参数按值传递，复制的是引用：可以修改共享对象，但不能借重新赋值替换调用方变量。ref 传入变量的引用，方法可以替换调用方变量本身。
  explanation: |-
    ### 场景：函数要清空列表，还是换一个列表？
    ```csharp
    using System.Collections.Generic;
    static void Change(List<int> value) {
        value.Add(2);                  // 调用方看得到
        value = new List<int> { 9 };   // 只改了局部参数
    }
    static void Replace(ref List<int> value) {
        value = new List<int> { 9 };   // 替换调用方变量
    }
    ```

    ### 从语义深入到接口设计
    先分别画出“变量”和“对象”：修改对象成员与修改保存引用的变量不是一回事。值类型使用 ref 时同样可以直接修改调用方的值，但共享可变状态会扩大副作用范围。

    如果函数只需要返回新集合，显式返回值通常更容易表达所有权；确需修改调用方变量才使用 ref。不要把 ref 当作无条件提速开关。

    ### 验证
    对普通传参和 ref 传参分别检查元素变化、引用是否被替换、null 输入的契约，以及调用方已有别名是否仍指向旧对象。

    **回答要点：** 复制什么 → 修改哪一层 → 调用方可见结果 → API 契约。
  pitfalls:
    - 把引用类型按值传参称为 ref 传参。
    - 以为替换一个变量会让其他旧别名自动改指向。
