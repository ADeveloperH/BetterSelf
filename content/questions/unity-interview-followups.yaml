- id: q-allocation-proof
  parentId: q-boxing
  title: 如何用工具证明一个高频调用确实发生了分配？
  topic: C# 与内存
  tags: *a2
  level: 场景
  shortAnswer: 先在目标 Player 复现并找到对应帧的 GC.Alloc 调用栈，再用保留相同业务行为的最小改动做对照。报告调用次数、每次或每帧分配以及构建环境，不能只引用 Editor 中一个总数。
  explanation: |-
    ### 场景：怀疑每帧日志接口把 int 装箱
    先写下假设：哪个参数发生了 int → object 转换、每帧调用多少次、预期如何消除。GC.Alloc 只能说明托管分配，需要调用栈才能定位来源。

    ### 操作路径
    1. 在目标设备运行可采样的测试 Player，通过 `Window > Analysis > Profiler` 连接目标。
    2. 在 CPU Usage 模块选择产生问题的帧，检查 GC.Alloc 样本；需要时启用该版本支持的分配 Call Stacks 捕获。
    3. 将日志输出、初始化、集合扩容等噪声隔离；仅替换怀疑的调用，重复同一输入路径。
    4. 用日志关闭的正常发布配置复核帧时间，记录 Player、脚本后端和采样开销。

    ### 证据应该怎么说
    “目标调用的分配栈消失，业务输出一致”比“改完 GC 数值变小”更有说服力。Deep Profile 会显著扰动耗时，先用普通采样与分配栈定位，必要时才缩小范围使用。

    **回答要点：** 可证伪假设 → 调用栈 → 单变量对照 → 发布配置复核。
  pitfalls:
    - 把 Profiler 自身或 Editor 界面分配算成业务调用。
    - 只看总分配减少就断言某个转换被消除。
