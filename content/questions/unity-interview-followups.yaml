- id: q-jobs-boundary
  parentId: q-coroutines
  title: 哪些工作适合交给 Job System 或后台任务？
  topic: Unity 异步与生命周期
  tags: *a7
  level: 场景
  shortAnswer: 适合的是可划分、以纯数据为输入输出、线程安全且计算量足够的工作；对象和场景操作通常回到主线程执行。需要计算调度、数据复制和等待成本，并按取消、销毁和结果应用设计生命周期。
  explanation: >-
    ### 场景：批量计算角色路径评分

    把读取场景对象、构造数值输入、并行计算和主线程应用结果分开。先问数据是否互相依赖，是否允许晚一帧应用；没有独立数据边界时，先设计边界再谈并行。


    ### 选择工具

    Unity Jobs 适合引擎支持的数据与调度模型，通常配合 NativeContainer 管理内存和依赖；后台 Task 可用于平台支持的纯托管计算或合适的 I/O 协作。async
    本身不保证后台执行，不能把 await 当作线程切换声明。


    ### 继续深入：任务结束时角色已回收

    结果带请求 / 租用版本，回主线程应用前重新确认对象身份和任务所有权。取消请求不保证已经排队的回调不会到达；丢弃过期结果与释放资源都要考虑。不要从工作线程随意访问 GameObject、Transform 等
    API。


    ### 验证与取舍

    对比串行、调度、等待和回传的完整成本；小任务可能被调度成本抵消。检查数据竞争、资源释放、切场景退出、异常和目标平台支持，不以“多线程”本身作为优化成功证据。


    **回答要点：** 数据依赖 → 工具边界 → 生命周期 → 完整成本。
  pitfalls:
    - 认为 await 后必定到了后台线程。
    - 忽略回传时对象已被复用或销毁。
