- id: q-struct-list-copy
  parentId: q-value-reference
  title: 结构体内有一个 List 字段，复制后修改 List 会发生什么？
  topic: C# 与内存
  tags: &a1
    - C#
    - 类型系统
  level: 场景
  shortAnswer: 结构体赋值复制各字段；List 字段复制的是引用，因此两个结构体仍能指向同一个 List。修改共享列表会相互可见，但把其中一个结构体的字段重新指向新列表，不会替换另一个结构体的字段。
  explanation: |-
    ### 从背包快照场景开始
    你把背包结构体复制给“预览窗口”，期望预览增删物品不影响真实背包。先问清字段是独立数值还是引用；struct 并不自动提供深拷贝。

    ```csharp
    using System.Collections.Generic;
    struct Bag { public List<int> Items; }

    // 方法内的示意代码
    var original = new Bag { Items = new List<int> { 1 } };
    var preview = original;
    preview.Items.Add(2); // original.Items.Count 也变为 2
    preview.Items = new List<int> { 9 };
    // original.Items 仍是包含 1、2 的原列表
    ```

    ### 再加一个约束：列表里放的是 Item 对象
    `new List<Item>(oldList)` 只复制容器，内部 Item 引用仍可能共享。要么明确复制需要独立的状态，要么采用不可变快照 / ID 加值数据；不能仅凭“复制了集合”断言整个对象图独立。

    ### 怎么验证与取舍
    分别断言“Add 到共享列表”和“替换列表字段”的结果，再修改一个嵌套 Item 的属性检查隔离边界。大对象图全量复制会增加分配与维护成本，先确定预览真正要修改的数据。

    **回答要点：** 字段级复制 → 共享对象 → 嵌套引用 → 隔离策略与成本。
  pitfalls:
    - 认为 struct 一定在栈上，因而内部 List 也不会共享。
    - 把容器复制等同于递归深拷贝。
