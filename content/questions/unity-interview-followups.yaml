- id: q-allocation-frame-time
  parentId: q-gc-alloc
  title: 为什么减少托管分配之后，还需要检查帧时间？
  topic: 移动端性能诊断
  tags: &a6
    - Unity
    - GC
    - 性能分析
  level: 场景
  shortAnswer: 托管分配只是帧耗时的一种来源。即使 GC.Alloc 降到很低，GPU、原生分配、主线程计算、同步等待或资源加载仍可能造成长帧；缓存和对象池还可能增加常驻内存。
  explanation: |-
    ### 场景：GC.Alloc 明显下降，但玩家仍觉得卡
    先把“卡”转成可观测现象：持续低帧、周期长帧、切关停顿，还是首个特效抖动。然后对齐修改前后的相同操作时段，不比较两个不同关卡的平均 FPS。

    ### 逐步分流
    1. 找到长帧在 CPU、渲染线程或 GPU 的对应证据；主线程在等不代表主线程脚本最慢。
    2. 检查加载、实例化、Shader 首次使用以及对象池预热是否把成本移到了其他时段。
    3. 对比稳定段帧时间、长帧分布、内存峰值、启动和切关，关注优化是否转移了负担。

    ### 最终如何回答
    可以说“目标托管分配已经减少，但当前长帧仍由某阶段主导，下一步收集对应证据”。不能把指标改善直接等同于体验问题已解决；本题没有提供实际采样，因此不预设唯一根因。

    **回答要点：** 分配指标与体验指标 → CPU/GPU 分流 → 成本转移 → 未知证据。
  pitfalls:
    - 把 GC.Alloc = 0 当作整帧没有内存或性能开销。
    - 只看平均 FPS，忽略长帧和内存峰值。
