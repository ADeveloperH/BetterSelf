- id: q-string-benchmark
  parentId: q-string-builder
  title: 你会如何设计一次可信的对比测试？
  topic: C# 与内存
  tags: *a3
  level: 场景
  shortAnswer: 固定输入、输出和目标环境，预热后比较完整路径，并同时记录分配与耗时。将少量拼接、循环拼接和容量策略分别测量，保留原始样本和波动，不能只挑一次更快的结果。
  explanation: |-
    ### 场景：把所有字符串拼接改成 StringBuilder？
    先分开真实调用：两三段固定文案、循环追加大量条目、UI 高频刷新。每种工作负载要有代表性的长度与次数，不用同一结论覆盖全部场景。

    ### 测试步骤
    1. 固定 Unity 版本、目标设备、脚本后端与构建配置；初始化和预热不混进稳定段。
    2. 两种实现输出完全相同，计入 StringBuilder 的创建 / 重用、扩容和最终 ToString。使用结果，避免无效工作被优化掉。
    3. 计时区间内不打日志，多轮采样并交错执行，关注温度、频率与后台干扰。
    4. 先比较耗时、分配和长期占用，再回到完整界面检查是否真正减少卡顿。

    ### 再深入：为什么不只看均值
    少量长帧可能被均值淹没；保留采样数量、稳定区间、P95 / P99 与最慢帧背景。百分位结果也受样本规模影响，不能没有原始数据就给出固定收益百分比。

    **回答要点：** 真实负载 → 完整成本 → 噪声控制 → 统计与业务效果。
  pitfalls:
    - 只计 Append，不计创建和 ToString。
    - 用单次 Editor 计时宣布所有手机都提升同样比例。
