- id: q-ui-text-refresh
  parentId: q-string-builder
  title: 高频更新 UI 文本时，哪些更新其实可以省略？
  topic: C# 与内存
  tags: &a3
    - C#
    - 字符串
  level: 场景
  shortAnswer: 先省掉显示结果没有变化的赋值：例如倒计时只显示整数秒时，在可见秒数变化时才刷新；面板不可见时暂停刷新。随后再优化格式化和控件更新成本，而不是每帧先构造字符串再比较。
  explanation: |-
    ### 场景：60 FPS 更新一个按秒显示的倒计时
    先确认产品展示精度、时间来源和重新打开面板的行为。即使底层时间每帧变化，可见内容也可能每秒只变一次。

    ```csharp
    int shownSeconds = -1;
    void Refresh(float remaining) {
        int seconds = UnityEngine.Mathf.Max(0,
            UnityEngine.Mathf.CeilToInt(remaining));
        if (seconds == shownSeconds) return;
        shownSeconds = seconds;
        // 在这里格式化，并更新实际使用的文本控件
    }
    ```

    ### 再加约束：后台回来、语言切换、面板复用
    重新绑定数据或格式规则改变时应使缓存失效，不能因为秒数相同而漏掉语言、样式或新任务文案。倒计时以正确时间源重新计算，不靠减少刷新次数累计时间。

    ### 怎么证明收益
    分别测格式化分配和 UI 重建成本，并检查边界秒数、到零、隐藏重开与暂停恢复。StringBuilder 仍可能需要最终字符串，减少无效刷新通常比盲目替换拼接方式更直接。

    **回答要点：** 可见结果变化 → 缓存失效条件 → 刷新成本 → 功能回归。
  pitfalls:
    - 先 ToString 或拼接，再比较新旧字符串，忽略此前已发生的构造。
    - 仅按数值缓存，语言或绑定对象变化时不刷新。
