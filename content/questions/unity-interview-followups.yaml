- id: q-performance-regression
  parentId: q-gc-alloc
  title: 怎样证明这次修改没有引入功能回归？
  topic: 移动端性能诊断
  tags: *a6
  level: 场景
  shortAnswer: 从改动机制列出可能受影响的行为，建立有明确断言的回归矩阵，并在相同设备与构建条件下同时对比性能。只能说明已覆盖范围通过，不能证明不存在任何回归。
  explanation: |-
    ### 场景：用对象池替代频繁创建销毁
    收益假设是减少创建与分配，新的风险是旧状态、回调与所有权被保留。测试必须验证行为，不只是断言池里有多少对象。

    ### 逐层加约束
    - 基本复用：连续生成、回收、再生成，确认 Transform、粒子、动画、碰撞和业务字段符合新对象契约。
    - 异步时序：对象回收后旧请求才结束，旧回调不得修改新租用状态；双重回收或重复完成也应安全。
    - 生命周期：切场景、暂停恢复、失败重试、超出池容量和内存压力下，检查泄漏与行为。
    - 视觉与性能：同一场景截图 / 录像对照，检查首帧跳变，同时比较帧时间、加载时间和峰值内存。

    ### 发布与回退
    先保留基线、变更开关和对应构建材料，内部回归通过后再逐步观察。只有实际跑过的用例才能写“通过”，未执行的设备或长时稳定性必须列为待验证。

    **回答要点：** 改动风险 → 可断言用例 → 真机对照 → 发布监测与回退。
  pitfalls:
    - 以单元测试通过替代所有真机视觉和长时测试。
    - 对象池只检查位置复位，不模拟迟到回调。
