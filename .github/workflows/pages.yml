name: Check and publish BetterSelf

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test content and learning records
        run: npm test
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build for the published path
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
